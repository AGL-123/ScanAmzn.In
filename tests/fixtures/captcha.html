<!doctype html>
<html lang="en-in" class="a-no-js a-lt-ie9 a-lt-ie8 a-lt-ie7">
<head>
<meta charset="utf-8">
<title dir="ltr">Amazon.in</title>
</head>
<body>
<div class="a-container a-padding-double-large" style="min-width:350px;padding:44px 0 !important">
  <div class="a-row a-spacing-double-large" style="width: 350px; margin: 0 auto">
    <div class="a-row a-spacing-medium a-text-center"><i class="a-icon a-logo"></i></div>
    <div class="a-box a-alert a-alert-info a-spacing-base">
      <div class="a-box-inner">
        <i class="a-icon a-icon-alert"></i>
        <h4>Enter the characters you see below</h4>
        <p class="a-last">Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</p>
      </div>
    </div>
    <div class="a-section">
      <form method="get" action="/errors/validateCaptcha" name="">
        <input type=hidden name="amzn" value="xyz">
        <div class="a-row a-text-center"><img src="https://images-na.ssl-images-amazon.com/captcha/abc/Captcha_def.jpg"></div>
        <input autocomplete="off" spellcheck="false" placeholder="Type characters" id="captchacharacters" name="field-keywords" type="text">
        <button type="submit" class="a-button-text">Continue shopping</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
