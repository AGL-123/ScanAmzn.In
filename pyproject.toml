[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanamzn"
version = "1.0.0"
description = "Watch Amazon.in for Indian-rupee PlayStation (PS5) gift cards and alert by e-mail and WhatsApp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Strongly recommended wherever wheels exist (PC, Docker, GitHub Actions): Chrome
# TLS impersonation gets far fewer captchas, lxml parses faster. Phones (Termux)
# run fine without them.
fast = ["lxml>=5.0", "curl_cffi>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
scanamzn = "scanamzn.cli:main"

[tool.setuptools.packages.find]
include = ["scanamzn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
